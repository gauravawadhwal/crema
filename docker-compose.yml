# Crema server with Docker Compose. Copy .env.example to .env and fill it in, then:
#   docker compose up -d
services:
  crema:
    build:
      context: .
      args:
        AI_CLIS: ${AI_CLIS:-}
    image: crema
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file: .env
    volumes:
      - crema-images:/data
      # Codex CLI login, if you use codex-cli. Log in once with
      #   docker compose run --rm crema codex login --device-auth
      # It holds tokens for your ChatGPT account: treat it like a password.
      - codex-home:/home/node/.codex
volumes:
  crema-images:
  codex-home:
