# Checks every pull request and push to main. The release and Pages workflows
# call this first, so a failing check stops a skin release or a site deploy.
#
# Jobs run side by side: `verify` (types, unit and server tests, generated files, the
# skin ZIP), `ui` (the Playwright checks in a real Chromium, split into four groups of
# about a minute each so no one job holds up the rest) and `docker` (the optional
# server's image builds and works, with the mock AI; no secrets needed).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit, server flow against the simulator, evals harness, and skin/engine.js freshness.
      - run: npm test
      - name: Web app parses
        run: for f in skin/*.js; do node --check "$f"; done
      # The Pages site and the embeddable demo ship demo/crema-demo.html as committed.
      - name: Built demo matches the source
        run: |
          node scripts/build-demo.mjs
          git diff --exit-code -- demo/crema-demo.html || { echo "::error::demo/crema-demo.html is stale. Run node scripts/build-demo.mjs and commit it."; exit 1; }
      - name: Skin ZIP is installable
        run: |
          node scripts/package-skin.mjs
          node scripts/check-skin-zip.mjs

  ui:
    name: ui (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [demo, live, controls, brewing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser build is tied to the Playwright version in package-lock.json.
      - name: Cache Playwright's Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Click-through, source app
        if: matrix.group == 'demo'
        run: node scripts/e2e-demo.cjs --shots ui-shots/demo
      - name: Click-through, built single-file demo
        if: matrix.group == 'demo'
        run: node scripts/e2e-demo.cjs --built
      - name: Independent shot-history panes, source and built demo
        if: matrix.group == 'demo'
        run: node scripts/e2e-shot-history.cjs && node scripts/e2e-shot-history.cjs --built
      - name: Live mode against the simulator
        if: matrix.group == 'live'
        run: node scripts/e2e-live.cjs
      - name: Stop and start races, source app
        if: matrix.group == 'controls'
        run: node scripts/e2e-controls.cjs
      - name: Stop and start races, built single-file demo
        if: matrix.group == 'controls'
        run: node scripts/e2e-controls.cjs --built
      - name: Home screen fits the tablet
        if: matrix.group == 'brewing'
        run: node scripts/check-tablet-fit.cjs ui-shots/fit
      - name: Bagless and manual brewing
        if: matrix.group == 'brewing'
        run: node scripts/e2e-brewing.cjs
      - name: Saved shot review and fallback
        if: matrix.group == 'brewing'
        run: node scripts/e2e-review.cjs
      - name: Keep screenshots when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.group }}
          path: ui-shots/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # For the simulated Decaid the container's proxy talks to.
      - run: npm ci
      - name: Server image builds and serves (mock AI, simulator)
        run: node scripts/docker-smoke.mjs
      # The image the docs suggest for a Claude or ChatGPT subscription.
      - name: Image with the AI CLIs builds and they start
        run: |
          docker build --build-arg AI_CLIS="@anthropic-ai/claude-code @openai/codex" -t crema-cli .
          docker run --rm crema-cli sh -c 'claude --version && codex --version'
